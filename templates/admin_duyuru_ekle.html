<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yeni Duyuru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0b0c10;color:#f1f5f9;}</style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Nova Admin</a></div></nav>
    <div class="container my-5">
        <h2>✏️ Yeni Duyuru Oluştur</h2>
        <form method="POST" class="mt-4 bg-dark p-4 rounded">
            <div class="mb-3"><label>Başlık</label><input type="text" name="baslik" class="form-control bg-dark text-white" required></div>
            <div class="mb-3"><label>İçerik</label><textarea name="icerik" class="form-control bg-dark text-white" rows="6" required></textarea></div>
            <button type="submit" class="btn btn-primary">Yayınla</button>
            <a href="/admin/duyurular" class="btn btn-secondary">Geri</a>
        </form>
    </div>
</body>
</html>
