<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Duyuru Yönetimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{background:#0b0c10;color:#f1f5f9;}</style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Nova Admin</a></div></nav>
    <div class="container my-5">
        <div class="d-flex justify-content-between">
            <h2>📢 Duyurular</h2>
            <a href="/admin/duyuru/ekle" class="btn btn-success">+ Yeni Duyuru</a>
        </div>
        {% for d in duyurular %}
        <div class="bg-dark p-3 rounded mt-3 border border-secondary">
            <h4>{{ d.baslik }}</h4>
            <p>{{ d.icerik }}</p>
            <small class="text-muted">{{ d.created_at[:16] }} - {{ d.yazar or 'Admin' }}</small>
            <form action="/admin/duyuru/sil/{{ d.id }}" method="POST" class="d-inline ms-3">
                <button class="btn btn-danger btn-sm" onclick="return confirm('Silmek istediğinize emin misiniz?')">Sil</button>
            </form>
        </div>
        {% endfor %}
        <a href="/" class="btn btn-secondary mt-4">Ana Sayfa</a>
    </div>
</body>
</html>
